org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true
org.gradle.parallel=true

# Toolchain detection. build.gradle requires Java 21 LTS (Spring Boot 3.5 and
# jt400 are certified against LTS; the machine's default JDK may be newer).
#
# Rather than hardcode an absolute JDK path, let Gradle auto-detect and, if it
# cannot find 21, fall back gracefully. `mise` installs are picked up because
# they live under ~/.local/share/mise/installs/java, which Gradle scans when
# auto-detect is on and MISE_DATA_DIR/JAVA_HOME are discoverable.
org.gradle.java.installations.auto-detect=true
# Allow provisioning of the required toolchain when it is genuinely missing, so
# a fresh clone builds without a manual JDK install step.
org.gradle.java.installations.auto-download=true
