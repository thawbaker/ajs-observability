// Resolves the Java 21 toolchain automatically when the machine lacks it, so a
// fresh clone builds without a manual JDK install step. This is a settings
// plugin, not a project plugin — that is why it lives here. Pairs with
// org.gradle.java.installations.auto-download=true in gradle.properties.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ajs-observability'
