<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign up')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create account</h1>
        <p class="auth-sub">AJS Observability</p>

        <div class="note bad" th:if="${error}" th:text="${error}">error</div>

        <form method="post" th:action="@{/auth/sign-up}">
            <label class="field">
                <span>Name</span>
                <input type="text" name="name" th:value="${name}" required autofocus
                       autocomplete="name"/>
            </label>
            <label class="field">
                <span>Email</span>
                <input type="email" name="email" th:value="${email}" required
                       autocomplete="username"/>
            </label>
            <label class="field">
                <span>Password</span>
                <input type="password" name="password" required minlength="8"
                       autocomplete="new-password"/>
                <small>At least 8 characters.</small>
            </label>
            <button type="submit" class="btn-primary">Create account</button>
        </form>

        <p class="auth-alt">
            Already have an account? <a th:href="@{/sign-in}">Sign in</a>
        </p>

        <!--
          Stated explicitly because it is a security-relevant expectation: the
          public form cannot mint administrators, only the admin UI can.
        -->
        <p class="auth-alt" style="font-size: 11px;">
            New accounts are created with read-only access.
        </p>
    </div>
</div>
</body>
</html>
